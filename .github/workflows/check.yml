name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check main.js
      - run: node --check preload.js
      - run: node --check preload-titlebar.js
      - run: node --check sync-from-web.js
