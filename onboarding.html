<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- script-src 必须含 unsafe-inline：页面逻辑在内联 <script> 里，缺了按钮会完全无响应 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>DSH Desktop 首次设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8; --fg: #1f2328; --muted: #656d76; --text: #3d444d;
      --card: #ffffff; --border: #d0d7de; --input: #ffffff; --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --text: #c9d1d9;
        --card: #161b22; --border: #30363d; --input: #0d1117; --link: #4d9fff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card { width: 100%; max-width: 560px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo {
      width: 40px; height: 40px; border-radius: 10px;
      overflow: hidden; flex-shrink: 0;
    }
    .logo svg { display: block; width: 40px; height: 40px; }
    h1 { font-size: 22px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--text); }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--fg);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--link); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
    .hint a { color: var(--link); }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    .primary { background: #2f81f7; border-color: #2f81f7; color: #fff; font-weight: 600; }
    .ghost { background: transparent; color: var(--text); }
    .note {
      font-size: 12px; color: var(--muted); line-height: 1.6;
      border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
    }
    .status { font-size: 13px; color: #f0883e; min-height: 18px; margin-top: 8px; }
    .checks { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .check {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; color: var(--text); line-height: 1.45; cursor: pointer;
    }
    .check input { margin-top: 3px; }
    .check .hint { margin-top: 2px; }
    .check.disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="40" height="40">
          <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="#121214" stroke="#2A2A2E" stroke-width="1"/>
          <rect x="13.5" y="13.5" width="37" height="37" rx="8" fill="none" stroke="#E8E4DC" stroke-width="1.75"/>
          <circle cx="32" cy="32" r="3.4" fill="#E8E4DC"/>
        </svg>
      </div>
      <div>
        <h1>DSH Desktop</h1>
        <div class="sub">个人开发者 Zer0 · 非官方 · 里面是官方 dsh web</div>
      </div>
    </div>

    <div class="box" style="padding:14px 20px;">
      <div style="font-size:13px; color:var(--text); line-height:1.55;">
        启动、同步、跟内核更新是这个窗口的事。Agent / 插件 / 模型走官方 Discussions。
        <a href="#" id="link-about">关于（初心与声明）</a>
      </div>
    </div>

    <div class="box">
      <label for="key">DeepSeek API Key</label>
      <input type="password" id="key" placeholder="sk-..." autocomplete="off" spellcheck="false" />
      <div class="hint">
        <a href="#" id="link-get">platform.deepseek.com</a> 创建。默认模型 <code>deepseek-v4-pro</code>。
      </div>
      <div class="checks">
        <label class="check" id="row-share">
          <input type="checkbox" id="pref-share-home" />
          <span>
            和本机 ~/.dsh 共用数据
            <div class="hint" id="share-hint">默认用独立目录</div>
          </span>
        </label>
        <label class="check" id="row-sessions">
          <input type="checkbox" id="pref-auto-sessions" checked />
          <span>
            启动时同步本机网页端会话和外接模型
            <div class="hint" id="sess-hint">正在检测 ~/.dsh …</div>
          </span>
        </label>
        <label class="check" id="row-update">
          <input type="checkbox" id="pref-auto-update" />
          <span>
            启动时检查并安装内核更新（要下载，可能较久）
            <div class="hint" id="upd-hint">勾上后启动会拉官方包，可能要等很久。一般先用自带版本</div>
          </span>
        </label>
      </div>
      <div class="status" id="status"></div>
      <div class="row">
        <button class="primary" id="btn-save">开始使用</button>
        <button class="ghost" id="btn-skip">跳过</button>
      </div>
    </div>

    <div class="note">
      Key 只存在本机。其他模型去设置加，或勾上面的共用。
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = (m) => { $('status').textContent = m; };
    if (!window.desktop) status('初始化失败：window.desktop 未定义');

    function extraPrefs() {
      return {
        shareWebHome: !!$('pref-share-home').checked,
        autoSyncSessions: !!$('pref-auto-sessions').checked,
        autoUpdateKernel: !!$('pref-auto-update').checked,
      };
    }

    $('link-get').addEventListener('click', (e) => {
      e.preventDefault();
      window.open('https://platform.deepseek.com/api_keys', '_blank');
    });
    $('link-about').addEventListener('click', (e) => {
      e.preventDefault();
      if (window.desktop && window.desktop.openAbout) window.desktop.openAbout();
    });

    $('btn-save').addEventListener('click', async () => {
      const key = $('key').value.trim();
      if (!key) { status('先填 Key，或者跳过。'); return; }
      $('btn-save').disabled = true;
      $('btn-skip').disabled = true;
      status('正在启动 DeepSeek Harness…');
      try {
        await window.desktop.saveKey(key, extraPrefs());
      } catch (err) {
        status('启动失败：' + (err && err.message ? err.message : err));
        $('btn-save').disabled = false;
        $('btn-skip').disabled = false;
      }
    });

    $('btn-skip').addEventListener('click', async () => {
      $('btn-skip').disabled = true;
      $('btn-save').disabled = true;
      status('正在启动 DeepSeek Harness…');
      try {
        await window.desktop.skip(extraPrefs());
      } catch (err) {
        status('启动失败：' + (err && err.message ? err.message : err));
        $('btn-skip').disabled = false;
        $('btn-save').disabled = false;
      }
    });

    $('key').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('btn-save').click();
    });

    (async () => {
      try {
        const st = await window.desktop.getState();
        if (st && st.hasKey) {
          $('key').placeholder = '已配置（留空则沿用现有密钥）';
        }
        const sess = st && st.sessions;
        const shareBox = $('pref-share-home');
        const hasWeb = !!(sess && sess.exists);
        shareBox.disabled = !hasWeb;
        if (!hasWeb) {
          $('share-hint').textContent = '这台电脑没有 ~/.dsh';
          $('row-share').classList.add('disabled');
        } else {
          $('share-hint').textContent = '共用后两边读写同一份数据';
        }
        const syncHint = () => {
          if (shareBox.checked) {
            $('sess-hint').textContent = '已共用，不必再拷贝';
            $('row-sessions').classList.add('disabled');
            $('pref-auto-sessions').disabled = true;
          } else if (sess && sess.exists && sess.count > 0) {
            const mb = (sess.size / 1024 / 1024).toFixed(1);
            const done = st.lastSessionSync ? '，已同步过' : '';
            $('sess-hint').textContent = `网页端 ${sess.count} 个会话（${mb} MB）${done}`;
            $('row-sessions').classList.remove('disabled');
            $('pref-auto-sessions').disabled = false;
          } else {
            $('sess-hint').textContent = '没有可同步的网页端会话';
            $('row-sessions').classList.remove('disabled');
            $('pref-auto-sessions').disabled = false;
          }
        };
        shareBox.addEventListener('change', syncHint);
        syncHint();
      } catch (err) {
        status('读取配置失败：' + (err && err.message ? err.message : err));
      }
    })();
  </script>
</body>
</html>
